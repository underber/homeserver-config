[Service]
EnvironmentFile=/etc/caddy/caddy.env
# Override ExecStart to drop --environ flag (avoids leaking TS_AUTHKEY into journal)
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile

# tsnet サイドカーが14個あり順次起動するためデフォルト90秒では足りない
TimeoutStartSec=300

# Recover automatically from transient tsnet failures.
Restart=on-failure
RestartSec=30s
