services:
  stump:
    image: aaronleopold/stump@sha256:02684fe218a2a54aee5e8bedd8306b971b857d562770ebc3c35400a706845b6e
    container_name: stump
    ports:
      - "127.0.0.1:10801:10801"
    environment:
      PUID: "1000"
      PGID: "1000"
      STUMP_CONFIG_DIR: /config
      TZ: Asia/Tokyo
    volumes:
      - /srv/docker/stump/config:/config
      - /srv/media/manga/library:/data/manga:ro
      - /srv/media/comics/library:/data/comics:ro
    restart: unless-stopped
