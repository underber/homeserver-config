<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.webmanifest"><title>Volkh Control</title><style>
:root{color-scheme:dark;--bg:#070b16;--card:#11182a;--line:#26324b;--text:#eef3ff;--muted:#94a3bd;--ok:#48d597;--bad:#ff6b7a;--accent:#7aa2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17213b,var(--bg) 38%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}main{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;margin:8px 0 20px}h1{font-size:1.45rem;margin:0}.muted{color:var(--muted);font-size:.8rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 30px #0004}.value{font-size:1.45rem;font-weight:700;margin-top:6px}.bar{height:7px;background:#27324a;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6)}h2{font-size:1rem;margin:24px 0 10px}.services a,.links a{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text)}.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.dot.up{background:var(--ok);box-shadow:0 0 12px var(--ok)}button{background:#263555;color:white;border:0;border-radius:10px;padding:8px 12px}.links .card{min-height:62px}.searchbox{display:flex;gap:8px}.searchbox input{flex:1;background:#0b1120;color:white;border:1px solid var(--line);border-radius:10px;padding:12px}.result{margin-top:8px}.result mark{background:#665500;color:#fff}.foot{text-align:center;margin:28px;color:var(--muted);font-size:.75rem}@media(max-width:480px){main{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:1.2rem}}
</style></head><body><main><div class="top"><div><h1>Volkh Control</h1><div class="muted" id="host">読み込み中</div></div><button onclick="refresh()">更新</button></div><section class="grid" id="stats"></section><h2>サービス</h2><section class="grid links" id="links"></section><h2>ChatGPT履歴検索</h2><div class="searchbox"><input id="query" placeholder="例: ホームサーバー"><button onclick="searchChats()">検索</button></div><section id="results"></section><div class="foot" id="updated"></div></main><script>
const fmt=b=>b==null?'—':b>1e12?(b/1e12).toFixed(1)+' TB':b>1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(0)+' MB';
const duration=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return `${d}日 ${h}時間`};
const stat=(name,val,p)=>`<div class="card"><div class="muted">${name}</div><div class="value">${val}</div>${p==null?'':`<div class="bar"><i style="width:${p}%"></i></div><div class="muted">${p}%</div>`}</div>`;
async function refresh(){try{const s=await fetch('/api/status').then(r=>r.json());host.textContent=`${s.hostname} · 稼働 ${duration(s.uptime_seconds)}`;stats.innerHTML=stat('メモリ',`${fmt(s.memory.used)} / ${fmt(s.memory.total)}`,s.memory.percent)+stat('OSディスク',fmt(s.root_disk.free)+' 空き',s.root_disk.percent)+stat('メディア',fmt(s.media_disk.free)+' 空き',s.media_disk.percent)+stat('バックアップ',s.backup.result==='success'?'正常':s.backup.result)+stat('負荷',s.load[0].toFixed(2));updated.textContent='更新 '+new Date(s.generated_at*1000).toLocaleString('ja-JP')}catch(e){host.textContent='状態取得エラー'}
try{const l=await fetch('/api/links').then(r=>r.json());links.innerHTML=l.map(x=>`<a class="card" href="${x.url}"><span>${x.name}</span></a>`).join('')}catch(e){}}
async function searchChats(){const q=query.value.trim();if(!q)return;results.innerHTML='<div class=muted>検索中...</div>';const r=await fetch('/api/search?q='+encodeURIComponent(q)).then(x=>x.json());results.innerHTML=Array.isArray(r)?r.map(x=>`<div class="card result"><b>${x.title}</b><div class=muted>${x.created}</div><div>${x.snippet}</div></div>`).join(''):'<div class=card>検索エラー</div>'}query.addEventListener('keydown',e=>{if(e.key==='Enter')searchChats()});refresh();setInterval(refresh,60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
