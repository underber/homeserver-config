name: pc-lab-isolated
services:
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:18081:8080"
    volumes:
      - ./www:/usr/share/nginx/html:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6

  moire-worker:
    build: ./moire-worker
    restart: unless-stopped
    environment:
      MOIRE_BLUR_RADIUS: "0.55"
      MOIRE_SHARPEN_PERCENT: "115"
      MOIRE_POLL_SECONDS: "20"
    volumes:
      - /srv/media/manga/moire-inbox/incoming:/data/incoming
      - /srv/media/manga/moire-inbox/processed:/data/processed
      - /srv/media/manga/moire-inbox/review:/data/review
    mem_limit: 512m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

